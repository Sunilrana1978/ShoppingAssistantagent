openapi: 3.0.3
info:
  title: User Profile Microservice API
  version: 1.0.0
servers:
  - url: https://shopping-user-service-331751626808.us-central1.run.app
paths:
  /api/v1/users/{user_id}/memories:
    post:
      operationId: add_user_memory
      summary: Save a long-term memory fact for the user in Firestore.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fact
              properties:
                fact:
                  type: string
      responses:
        "200":
          description: Memory fact saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  user_id:
                    type: string
                  fact:
                    type: string
