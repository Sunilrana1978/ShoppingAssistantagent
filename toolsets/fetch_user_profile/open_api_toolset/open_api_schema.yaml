{
  "description": "Fetch live user profile metadata, long-term memory facts, and previous cart snapshot from Firestore.",
  "openapi": "3.0.3",
  "info": {
    "title": "User Profile Microservice API",
    "version": "1.0.0",
    "description": "Enterprise Cloud Run microservice API for live Firestore user profile, memories, and previous cart retrieval."
  },
  "servers": [
    {
      "url": "https://shopping-user-service-331751626808.us-central1.run.app"
    }
  ],
  "paths": {
    "/api/v1/users/{user_id}": {
      "get": {
        "operationId": "fetch_user_profile",
        "summary": "Fetch live user profile metadata, long-term memory facts, and previous cart snapshot from Firestore.",
        "parameters": [
          {
            "name": "user_id",
            "in": "path",
            "required": true,
            "description": "Unique user identifier (e.g. u_1029)",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Live Firestore user profile data",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "status": { "type": "string" },
                    "user_id": { "type": "string" },
                    "user_name": { "type": "string" },
                    "membership_tier": { "type": "string" },
                    "memories": {
                      "type": "array",
                      "items": { "type": "string" }
                    },
                    "previous_cart": { "type": "object" }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
