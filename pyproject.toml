[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-assistant-agent"
version = "1.0.0"
description = "Sporting Goods Shopping Assistant Agent using CX Agent Studio and cxas-scrapi"
readme = "Shopping-Assistant-Agent-PRD.md"
requires-python = ">=3.10"
dependencies = [
    # Pinned: 1.8.0's V001/V004 lint rules have a docstring-parsing bug that
    # flags Optional fields as required whenever their description text
    # happens to contain the word "required" (e.g. OpenApiToolset.api_authentication,
    # Schema.required). Bump once fixed upstream.
    "cxas-scrapi==1.7.0",
    "google-adk>=0.1.0",
    "google-genai>=0.1.0",
    "google-cloud-aiplatform>=1.60.0",
    "pydantic>=2.0.0",
    "pytest>=7.0.0",
    "tomli>=2.0.0; python_version < '3.11'"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.setuptools.packages.find]
where = ["."]

