# Golden & Scenario Evaluations for Sporting Goods Multi-Agent Application
common_session_parameters:
  user_id: "u_1029"

conversations:
  - conversation: tc_01_gold_greeting
    session_parameters:
      user_id: "u_1029"
    turns:
      - user: "Hello"
        agent: "Hello Alex! Welcome back to our Sporting Goods Store. As a Gold member, you receive a 15% discount on all purchases today!"

  - conversation: tc_02_bronze_greeting
    session_parameters:
      user_id: "u_1031"
    turns:
      - user: "Hi there"
        agent: "Hi Taylor! Welcome to our store. As a Bronze member, you get a 5% discount on your order!"

  - conversation: tc_03_search_and_cart_arithmetic
    session_parameters:
      user_id: "u_1029"
    turns:
      - user: "I need trail running shoes"
        agent: "Here are the top trail running shoes available in our store:"
        tool_calls:
          - action: search_catalog
            args:
              query: "trail running shoes"
      - user: "Add sku_1029 size 10 to cart"
        agent: "Added Apex Trail Runner (Size 10) to your cart. Your subtotal is $129.99, discount (15%) is $19.50, and total is $110.49."
        tool_calls:
          - action: add_to_cart
            args:
              sku: "sku_1029"
              quantity: 1

  - conversation: tc_04_feedback_submission
    session_parameters:
      user_id: "u_1029"
    turns:
      - user: "I want to leave feedback: 5 stars, amazing recommendation!"
        agent: "Thank you for your 5-star review! Your feedback has been recorded."
        tool_calls:
          - action: submit_feedback
            args:
              rating: 5
              comments: "amazing recommendation!"

  - conversation: tc_05_silver_greeting
    session_parameters:
      user_id: "u_1030"
    turns:
      - user: "Hello"
        agent: "Hello Jordan! Welcome to our store. As a Silver member, you get a 10% discount on your purchase today!"

  - conversation: tc_06_guest_user_flow
    session_parameters:
      user_id: "guest"
    turns:
      - user: "Hello"
        agent: "Welcome to our Sporting Goods Store! How can I assist you today?"
      - user: "Add sku_1031 to my cart"
        agent: "Added Performance Dri-Fit T-Shirt to your cart. Subtotal: $89.99, Discount: $0.00, Total: $89.99."
        tool_calls:
          - action: add_to_cart
            args:
              sku: "sku_1031"
              quantity: 1

  - conversation: tc_07_cart_item_addition_and_removal
    session_parameters:
      user_id: "u_1030"
    turns:
      - user: "Add sku_1030 and sku_1033 to cart"
        agent: "Added both items to your cart. Subtotal: $179.98, Discount (10%): $18.00, Total: $161.98."
        tool_calls:
          - action: add_to_cart
            args:
              sku: "sku_1030"
              quantity: 1
      - user: "Remove sku_1033 from cart"
        agent: "Removed sku_1033. Updated Subtotal: $149.99, Discount (10%): $15.00, Total: $134.99."
        tool_calls:
          - action: remove_from_cart
            args:
              sku: "sku_1033"

  - conversation: tc_08_end_to_end_multi_agent_journey
    session_parameters:
      user_id: "u_1029"
    turns:
      - user: "Hi, I am looking for tennis rackets"
        agent: "Hello Alex! As a Gold member, you get 15% off. Here are our top tennis rackets:"
        tool_calls:
          - action: search_catalog
            args:
              query: "tennis rackets"
      - user: "Add sku_1032 to cart"
        agent: "Added Pro Staff Tennis Racket to your cart. Subtotal: $199.99, Discount (15%): $30.00, Total: $169.99."
        tool_calls:
          - action: add_to_cart
            args:
              sku: "sku_1032"
              quantity: 1
      - user: "I'd like to leave a 5 star rating: Excellent racket recommendation and seamless cart experience!"
        agent: "Thank you for the 5-star rating! Your feedback has been successfully submitted."
        tool_calls:
          - action: submit_feedback
            args:
              rating: 5
              comments: "Excellent racket recommendation and seamless cart experience!"

    expectations:
      - "The agent must provide personalized greetings and tier discounts"
      - "The agent must compute server-side cart pricing and submit customer feedback"

    tags: [P0, golden, scenario, multi-agent, shopping-assistant]
