<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Assistant — Web Widget Test</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    header h1 {
      font-size: 20px;
      margin: 0;
    }
    header p {
      color: #666;
      font-size: 14px;
    }
  </style>

  <script defer
    src="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/chat-messenger.js">
  </script>
  <link rel="stylesheet" href="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/themes/chat-messenger-default.css">
  <link rel="stylesheet" href="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/themes/chat-messenger-layout.css">
  <script>
    window.addEventListener("chat-messenger-loaded", () => {
      chatSdk.registerContext(
        chatSdk.prebuilts.ces.createContext({
          deploymentName: "projects/331751626808/locations/us/apps/shopping-assistant-app-dev/deployments/a5ea201d-d892-4594-a986-ec052c289bd5"
        }),
      );
    });
    // window.addEventListener("chat-messenger-loaded", () => {
    //   const cm = document.querySelector("chat-messenger");
    //   cm.accessToken = yourToken;
    // });
  </script>
</head>
<body>
  <header>
    <h1>Shopping Assistant Agent</h1>
    <p>Local test page for the deployed CXAS web widget (dev environment)</p>
  </header>

  <!-- Update the url-allowlist attribute with a comma-separated list of origins allowed to render images -->
  <chat-messenger
    url-allowlist="*"
  >
    <chat-messenger-container
      chat-title="Shopping Assitant"
      chat-title-icon="https://gstatic.com/dialogflow-console/common/assets/ccai-favicons/conversational_agents.png"
      enable-file-upload
      enable-audio-input
    >
      <chat-reset-session-button
        slot="titlebar-actions"
        title-text="Start new chat"
      ></chat-reset-session-button>
      <chat-toggle-dialog-button
        slot="titlebar-actions"
        title-text-expanded="Collapse"
        title-text-collapsed="Expand"
      ></chat-toggle-dialog-button>
      <chat-messenger-close-button
        slot="titlebar-actions"
        title-text="Close"
      ></chat-messenger-close-button>
    </chat-messenger-container>
  </chat-messenger>
</body>
</html>
