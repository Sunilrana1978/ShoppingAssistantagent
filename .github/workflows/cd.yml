name: CD Deployment Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install pydantic cxas-scrapi

      - name: Check GCP Secrets Availability
        id: gcp-auth-check
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          SA_EMAIL: ${{ secrets.GCP_SA_EMAIL }}
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$SA_EMAIL" ]; then
            echo "auth_enabled=true" >> $GITHUB_OUTPUT
          else
            echo "auth_enabled=false" >> $GITHUB_OUTPUT
            echo "⚠️ Notice: GCP_WIF_PROVIDER and GCP_SA_EMAIL secrets are not set in GitHub repository settings."
            echo "Executing deployment build in dry-run mode."
          fi

      - name: Authenticate to Google Cloud (Workload Identity)
        if: steps.gcp-auth-check.outputs.auth_enabled == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set Environment Target
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TARGET_ENV=prod" >> $GITHUB_OUTPUT
          else
            echo "TARGET_ENV=staging" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to CX Agent Studio
        run: |
          python scripts/build_app.py --env ${{ steps.set-env.outputs.TARGET_ENV }}
