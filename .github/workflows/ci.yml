name: CI Quality Gate

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate Manifests & Schemas
        run: |
          python scripts/validate_schemas.py

      - name: Run CXAS Linter
        run: |
          cxas lint

      - name: Run Unit Tests
        run: |
          pytest tests/

      - name: Run Simulation Evals
        run: |
          python evaluations/run_evals.py
